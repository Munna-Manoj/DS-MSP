%YAML:1.0
# =============================================================================
# DS-MSP[rig] calibration config — MC-Calib-compatible `calib_param.yml`.
#
# Drop-in with MC-Calib: run `python scripts/calibrate_rig.py --config <this file>`.
# Every key below is MC-Calib's own (so an existing MC-Calib config works unchanged),
# EXCEPT the two clearly-marked DS-MSP extensions: `camera_models` and `object_path`.
# Generate a fresh copy any time with: `python scripts/calibrate_rig.py --init-config calib_param.yml`
#
# Relative paths resolve against THIS file's directory. Override any value on the CLI:
#   --set root_path=/abs/Images --set save_path=/abs/out --set camera_models=kb,kb,radtan
# =============================================================================

######################################## Boards Parameters ###################################################
number_x_square: 5         # number of squares in the X direction
number_y_square: 5         # number of squares in the Y direction
resolution_x: 500          # [MC-Calib board-image gen; IGNORED by DS-MSP] horizontal px
resolution_y: 500          # [MC-Calib board-image gen; IGNORED by DS-MSP] vertical px
length_square: 0.04        # ChArUco square length (board generation units; sets marker dict geometry)
length_marker: 0.03        # inner ArUco marker length (board generation units; < length_square)
number_board: 1            # number of physical boards in the rigid object (1 is enough for overlapping cams)
boards_index: []           # [IGNORED by DS-MSP] empty => boards 0..number_board-1
square_size: 1.0           # physical square size (any unit: m/cm/mm) — sets the metric scale of 3D output

############# Boards Parameters for different board size (leave empty if all boards have the same size) #######
number_x_square_per_board: []
number_y_square_per_board: []
square_size_per_board: []

######################################## Camera Parameters ###################################################
distortion_model: 0          # 0:Brown (radtan / perspective)  //  1: Kannala (kb / fisheye)
distortion_per_camera: []    # per-camera 0/1; empty => all use `distortion_model`. Length must equal number_camera.

# --- DS-MSP EXTENSION (highest precedence; comment out to use distortion_model/_per_camera) ---
# Per-camera model name from {radtan, ucm, eucm, ds, kb, ocam, dsplus, eucmplus}.
# Overrides distortion_model / distortion_per_camera when present.
# camera_models: [ kb, kb, radtan ]

number_camera: 1           # number of cameras in the rig
refine_corner: 1           # [IGNORED by DS-MSP — CharucoDetector always sub-pixel refines]
min_perc_pts: 0.5          # [IGNORED by DS-MSP — uses a fixed min_corners=8 per board]

# initial intrinsics yml, or "None" to estimate from scratch. Schema = MC-Calib
# calibrated_cameras_data, extended with a per-camera `camera_model` so any DS-MSP model can be
# stated (see configs/camera_intrinsics.template.yml; emit one with --init-intrinsics PATH).
# When given: the model stated for each camera must match (fix_intrinsic=1) or is converted with a
# warning into (fix_intrinsic=0) the model chosen above (camera_models / distortion_model).
cam_params_path: "None"
fix_intrinsic: 0           # 0: estimate+refine intrinsics  //  1: hold intrinsics fixed (needs cam_params_path)

######################################## Images Parameters ###################################################
root_path: "../data/Images"   # folder of per-camera subfolders <cam_prefix><camID+1:03d>/ (e.g. Cam_001/)
cam_prefix: "Cam_"            # 1-indexed: camera 0 -> Cam_001, camera 1 -> Cam_002, ...
keypoints_path: "None"       # pre-detected keypoints yml; "None" => detect ChArUco corners from raw images

######################################## Optimization Parameters #############################################
quaternion_averaging: 1    # [IGNORED by DS-MSP — uses its own rotation averaging]
ransac_threshold: 10       # RANSAC reprojection threshold in px (keep high; removes only gross outliers)
number_iterations: 1000    # max iterations for the non-linear refinement

######################################## Hand-eye method #####################################################
he_approach: 0             # 0: bootstrapped hand-eye  //  1: traditional hand-eye

######################################## Output Parameters ###################################################
save_path: "../data/Results"        # results dir (yml files + Detection/ + Reprojection/)
save_detection: 0                   # 1 => write Detection/<cam_prefix><id>/<frame>.jpg (green detected corners)
save_reprojection: 0                # 1 => write Reprojection/<cam_prefix><id>/<frame>.jpg (green detected + red reprojected)
camera_params_file_name: ""         # output cameras filename; "" => calibrated_cameras_data.yml

# --- DS-MSP EXTENSION ---
# object_path: "None"      # pre-built fused 3D object (calibrated_objects_data.yml); "None"/absent => reconstruct from detections

######################################## Accepted-but-ignored MC-Calib keys (for drop-in compatibility) ######
# These newer MC-Calib keys parse without error but DS-MSP does not act on them yet:
#   board_poses_file_name, camera_board_poses_index, enable_rigidity_check, rigidity_threshold

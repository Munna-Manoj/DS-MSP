site_name: DS-MSP
site_description: Double Sphere & multi-model fisheye camera library — and a guided course in the geometry behind SLAM/SfM.
site_url: https://munna-manoj.github.io/DS-MSP/
repo_url: https://github.com/Munna-Manoj/DS-MSP
repo_name: Munna-Manoj/DS-MSP
docs_dir: docs
edit_uri: edit/main/docs/

# Internal governance/planning/authoring content lives under docs/ but is NOT part of the
# published site. readme-options/ and research/ are also gitignored (never reach a CI
# checkout at all); process/ and WRITING_GUIDE.md are tracked but contributor-facing, not
# reader-facing, so they're excluded here too.
exclude_docs: |
  process/
  research/
  readme-options/
  WRITING_GUIDE.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.footnote.tooltips
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
  # Typer's exact palette (github.com/fastapi/typer): black primary, teal accent, an
  # auto-detect variant first so the toggle cycles auto -> light -> dark -> auto.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

plugins:
  - search
  - glightbox:
      effect: zoom
      zoomable: true
      draggable: true
      auto_caption: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Legacy admonition/tabbed syntax (!!! note, === "Tab") kept active alongside the
  # Typer-style pymdownx.blocks.* syntax (/// tip, /// tab) below during the content
  # migration -- both syntaxes coexist without conflict. Drop the legacy two once every
  # page has migrated (tracked in the docs restyle plan).
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  # Typer's terse "/// tip ... ///" block syntax for admonitions and tabs.
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - abbr
  - footnotes
  - toc:
      permalink: true
  # Typer's real-file macro-inclusion mechanism: {* docs_src/path/to/file.py hl[1,2] *}
  - mdx_include
  - markdown_include_variants

extra_css:
  - css/termynal.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - js/termynal.js
  - js/custom.js

# Provisional nav using CURRENT files only -- gets replaced/expanded phase by phase as
# docs/learn/ is reorganized (a dedicated Explanation section), a How-to cookbook is authored,
# and a real generated API Reference lands. "Guides" is a placeholder Diátaxis-mixed bucket
# until those sections exist for real.
nav:
  - Home: index.md
  - Learn:
      - learn/README.md
      - 1 · Fisheye & camera models: learn/01_fisheye_and_camera_models.md
      - 2 · The Double Sphere model: learn/02_double_sphere_model.md
      - 3 · Projection validity & the >180° cone: learn/03_projection_validity.md
      - Capstone — calibrate a real camera: learn/capstone_calibrating_a_real_camera.md
      - "Companion: AprilGrid detection": learn/robust_aprilgrid_detection.md
      - "Companion: robust losses & evaluation": learn/robust_losses_and_evaluation.md
      - "Companion: stereo extrinsics": learn/stereo_extrinsics_calibration.md
      - "Companion: sphere/cylinder/pinhole": learn/spherical_and_cylindrical_reprojection.md
      - 8 · Two-view geometry on rays: learn/08_two_view_geometry_on_rays.md
  - How-to:
      - how-to/README.md
      - Calibrate any model: how-to/calibrate_any_model.md
      - Convert between models: how-to/convert_between_models.md
      - Read/write Kalibr YAML: how-to/read_write_kalibr.md
      - Solve PnP on a fisheye: how-to/solve_pnp_on_fisheye.md
      - Undistort images: how-to/undistort_images.md
      - Export an LDC mesh: how-to/export_ldc_mesh.md
  - Explanation:
      - explain/README.md
      - Two-view geometry (derivations): explain/two_view_geometry.md
      - Are two models the same camera?: explain/are_two_models_the_same_camera.md
      - Choosing a camera model: explain/choosing_a_camera_model.md
      - "Case study: EUCM+/DS+/KB": explain/case_study_eucmplus_dsplus_kb.md
      - Projection validity & FOV: explain/projection_validity_and_fov.md
  - Reference:
      - reference/index.md
      - Core (CameraModel contract): reference/core.md
      - Camera models: reference/models.md
      - Calibration: reference/calib.md
      - Detection: reference/detect.md
      - Model conversion: reference/adapt.md
      - Rig calibration: reference/rig.md
      - I/O (Kalibr/MC-Calib/COLMAP/nerfstudio): reference/io.md
      - Multi-view geometry: reference/mvg.md
      - Stereo: reference/stereo.md
      - Visual odometry: reference/vo.md
      - Geometry primitives: reference/geometry.md
      - Ops (undistort/PnP): reference/ops.md
      - Data: reference/data.md
      - OpenCV-compatible shim: reference/cv.md
      - LDC mesh export: reference/ldc.md
  - Guides:
      - Calibrate a single camera: CALIBRATE_GUIDE.md
      - Calibrate a multi-camera rig: RIG_CALIBRATION_GUIDE.md
      - Rig Blender evaluation: RIG_BLENDER_EVALUATION.md
      - Rig evaluation table: RIG_EVALUATION_TABLE.md
      - Rig outlier benchmark: RIG_OUTLIER_BENCHMARK.md
      - Multi-model library & conversion: MULTI_MODEL.md
  - Project:
      - Roadmap: ROADMAP.md

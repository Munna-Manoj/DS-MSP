%YAML:1.0
# =============================================================================
# DS-MSP[rig] — DETECT-ONCE, CALIBRATE-MANY config (keypoints reuse).
#
# ChArUco detection over a full rig is the slow part of a run. You only need to do it ONCE:
# the first run detects from raw images and SAVES `detected_keypoints_data.yml` into save_path;
# every later run reads that file via `keypoints_path` and SKIPS image detection entirely. This
# lets you re-calibrate the same capture with different camera models / intrinsics / options in
# seconds, exactly the way the intrinsics-robustness sweep is run.
#
# ----------------------------------------------------------------------------------------------
# STEP 1 — detect from images and save the keypoints (run this once):
#   Use a base config from `ds-msp-calibrate-rig --init-config calib_param.yml` (root_path ->
#   your images, save_path -> an output dir). It writes <save_path>/detected_keypoints_data.yml
#   and <save_path>/calibrated_objects_data.yml alongside the calibration result.
#
# STEP 2 — reuse the saved keypoints (this file): point keypoints_path at the saved file and set
#   root_path to "None". No image detection happens; only the rig math runs.
#     ds-msp-calibrate-rig --config calib_param.keypoints.template.yml \
#         --set keypoints_path=/abs/out/detected_keypoints_data.yml \
#         --set object_path=/abs/out/calibrated_objects_data.yml \
#         --set save_path=/abs/out_run2 --set camera_models=ds,ds,ds,ds,radtan,radtan,ds,ds
#   (git-clone checkouts can use `python scripts/calibrate_rig.py` instead -- same CLI either way)
# ----------------------------------------------------------------------------------------------
# The keypoints file is MC-Calib's exact `detected_keypoints_data.yml` schema, so a file produced
# by MC-Calib itself is also accepted here (and vice-versa).
#
# Boolean fields (fix_intrinsic, save_detection, save_reprojection, verbose, webviewer) are
# true/false, and MUST be quoted ("true"/"false") -- see calib_param.template.yml's header
# for why (a real cv2.FileStorage parser quirk, not a style preference).
# =============================================================================

######################################## Boards Parameters ###################################################
# These MUST match the board(s) the keypoints were detected against (they define the 3D object the
# saved 2D corners index into). For pure keypoints reuse + a pre-built object_path they are only a
# light consistency check, but keep them correct.
number_x_square: 7         # squares in X
number_y_square: 7         # squares in Y
length_square: 0.04        # ChArUco square length (board-generation units)
length_marker: 0.03        # inner ArUco marker length (< length_square)
number_board: 2            # number of physical boards in the rigid object
square_size: 100           # physical square size (sets the metric scale of the 3D output, e.g. mm)

######################################## Camera Parameters ###################################################
distortion_model: 1          # 0:Brown(radtan)  //  1:Kannala(kb). Used only if camera_models is absent.
distortion_per_camera: [1,1,1,1,0,0,1,1]   # per-camera 0/1 override of distortion_model

# --- DS-MSP EXTENSION (highest precedence): per-camera model, any of
#     {radtan, ucm, eucm, ds, kb, ocam, dsplus, eucmplus}. This is the knob you change between
#     reuse runs to compare models on the SAME detections. ---
# camera_models: [ ds, ds, ds, ds, radtan, radtan, ds, ds ]

number_camera: 8

# initial intrinsics yml (optional). With reuse you typically leave this "None" and estimate, or
# pass a previous run's calibrated_cameras_data.yml to seed/hold intrinsics. See
# configs/camera_intrinsics.template.yml for the per-model schema and the matching/convert rules.
cam_params_path: "None"
fix_intrinsic: "false"      # false => estimate+refine intrinsics  //  true => hold intrinsics fixed (needs cam_params_path)

######################################## Images Parameters ###################################################
# REUSE MODE: keypoints_path is set, root_path is "None" -> no image detection.
root_path: "None"
cam_prefix: "Cam_"
keypoints_path: "/abs/out/detected_keypoints_data.yml"   # the file saved by STEP 1

# --- DS-MSP EXTENSION: a pre-built fused 3D object from STEP 1 (recommended for multi-board rigs
#     so the object geometry is identical across reuse runs instead of re-reconstructed each time).
# object_path: "/abs/out/calibrated_objects_data.yml"

######################################## Optimization Parameters #############################################
ransac_threshold: 10       # px; removes only gross outliers
number_iterations: 1000    # max non-linear refinement iterations

######################################## Hand-eye method #####################################################
he_approach: 0             # 0: bootstrapped hand-eye  //  1: traditional hand-eye

######################################## Output Parameters ###################################################
save_path: "/abs/out_run2"          # results dir for THIS reuse run (keeps runs side by side)
save_detection: "false"             # overlays need raw images (root_path); off in pure reuse mode
save_reprojection: "false"          # overlays need raw images (root_path); off in pure reuse mode
camera_params_file_name: ""         # "" => calibrated_cameras_data.yml

# --- DS-MSP EXTENSION ---
# webviewer: "true"         # launch the live browser 3D view (default true); independent of `verbose`

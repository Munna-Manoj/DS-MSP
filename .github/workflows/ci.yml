name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run on the same ref (e.g. a second push to a PR) instead of
# letting both run to completion — saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change touches code/tests/build config. A docs-only change
  # (Markdown, the docs/process governance tree, LICENSE, …) skips the expensive test
  # work below. Defaults to running everything if the diff can't be determined.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'ds_msp/**'
              - 'tests/**'
              - 'scripts/**'
              - 'tools/**'
              - 'configs/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '.github/workflows/ci.yml'

  # Required check. The JOB always runs so the `lint + types + layering` status always
  # reports (branch protection stays satisfied), but on a docs-only change the heavy
  # steps are gated off — only ds_msp/** changes affect ruff/import-linter/mypy.
  lint:
    name: lint + types + layering
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: pip install -e ".[calib]" -r requirements-dev.txt
      - name: ruff (lint)
        if: needs.changes.outputs.code == 'true'
        run: ruff check .
      - name: import-linter (layer decoupling)
        if: needs.changes.outputs.code == 'true'
        run: lint-imports
      - name: mypy (typed core)
        # The core contracts/pinhole layer is fully typed and gated strictly here;
        # the typed surface expands over time (see pyproject [tool.mypy]).
        if: needs.changes.outputs.code == 'true'
        run: mypy ds_msp/core --follow-imports=silent --ignore-missing-imports
      - name: docs-only change — nothing to lint
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change — no Python touched, skipping lint/types/layering."

  # Always runs (no path gate): the governance checks validate the docs/process tree
  # itself — requirements.csv, the traceability matrix, ADRs, tree hygiene — so a
  # docs-only PR is exactly when they matter most. Pure stdlib, no install, ~seconds.
  governance:
    name: governance (traceability + tree hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: traceability (requirements <-> tests <-> ADRs in sync)
        run: python tools/check_traceability.py --check
      - name: tree hygiene (no tracked local-only / leak content)
        run: python tools/check_tree_hygiene.py

  # Fast tier: unit + contract tests across the support matrix, parallelized
  # (excludes the `slow` rig integration tests, run once in `test-slow`). Required
  # check: the JOB always runs so `tests (pyX)` always reports; on a docs-only change
  # every step is gated off and the job finishes in seconds with no install/test work.
  test:
    name: tests (py${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: pip install -e ".[calib]" -r requirements-dev.txt
      - name: pytest (fast, parallel, + coverage)
        if: needs.changes.outputs.code == 'true'
        run: pytest -q -n auto -m "not slow" --cov=ds_msp --cov-report=term-missing
      - name: docs-only change — skipping tests
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change — no code touched, skipping the test suite."

  # Slow tier: the rig integration suite, once (3.12 only), parallelized. Heavy but the
  # authoritative rig gate; kept off the per-Python fast matrix so it doesn't run 3x.
  # Not a required check, so the whole job is skipped on docs-only changes.
  test-slow:
    name: tests (slow / rig integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[calib]" -r requirements-dev.txt
      - name: pytest (slow rig integration, parallel)
        run: pytest -q -n auto -m "slow"

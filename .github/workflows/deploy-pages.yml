name: Deploy docs site + interactive studio to Pages

# Builds two things and publishes them as one site to https://munna-manoj.github.io/DS-MSP/:
#   - the MkDocs Material documentation site (Learn/How-to/Explanation/Reference) -- owns the
#     site root ("/")
#   - the Vite/React/three.js interactive studio in web/ -- deployed under "/studio/"
# actions/deploy-pages only accepts one artifact, so the two builds are merged into a single
# directory before upload: mkdocs' site/* -> artifact root, web/dist/* -> artifact/studio/.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "mkdocs.yml"
      - "ds_msp/**" # mkdocstrings renders the reference section from source docstrings
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build interactive studio
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build docs site
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict

      - name: Merge into one artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/studio
          cp -r web/dist/. _site/studio/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ds_msp"
version = "0.12.0"
description = "Double Sphere & multi-model spherical-camera platform: models, calibration, conversion & 3D for wide-FOV lenses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Munna-Manoj" }]
keywords = [
    "fisheye", "camera-model", "calibration", "double-sphere",
    "computer-vision", "slam", "opencv", "kannala-brandt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "opencv-python", "scipy", "pyyaml"]

[project.urls]
Homepage = "https://github.com/Munna-Manoj/DS-MSP"
Repository = "https://github.com/Munna-Manoj/DS-MSP"
Documentation = "https://github.com/Munna-Manoj/DS-MSP/tree/main/docs/learn"
Changelog = "https://github.com/Munna-Manoj/DS-MSP/blob/main/CHANGELOG.md"
Issues = "https://github.com/Munna-Manoj/DS-MSP/issues"

# Optional extras. `calib` adds the AprilGrid detector used to calibrate from real
# board images (e.g. TUM-VI). `webviewer` marks the live browser 3D view during rig
# calibration (ds_msp.rig.web3d.WebLive3DAnimator) as an opt-in capability -- it currently
# needs nothing beyond the core dependencies (stdlib http.server + numpy; Three.js loads
# from a CDN in the browser, not via pip), so this extra has no packages of its own today.
# It exists so `pip install ds-msp[webviewer]` is a stable, documented install target and
# stays that way if the viewer ever gains a real Python dependency. Kept optional (and,
# during a run, additionally gated by the `webviewer: true/false` calib_param.yml field --
# see ds_msp/rig/calib_param.py) so the core library installs lean and a headless/CI run
# never has to think about a browser.
[project.optional-dependencies]
calib = ["aprilgrid"]
webviewer = []
# Building the published MkDocs Material site (mkdocs.yml) -- not needed to use the library,
# only to build/preview the docs locally (`pip install -e ".[docs]"`, then `mkdocs serve`).
docs = ["mkdocs-material", "mkdocstrings[python]", "pymdown-extensions", "mkdocs-glightbox",
        "mdx-include", "markdown-include-variants"]

# `ds-msp-calibrate-rig`/`ds-msp-calibrate` are real console commands right after
# `pip install ds-msp` -- no repo clone needed. Their logic lives in ds_msp.rig.cli /
# ds_msp.calib.cli (NOT scripts/calibrate_rig.py / scripts/calibrate.py, which are excluded
# from the wheel/sdist -- see the packages.find comment below); those files are now just thin
# wrappers kept for git-clone convenience. validate.py/visualize.py (ad-hoc single-camera
# scripts) don't have an equivalent console command yet -- they still require a repo clone.
[project.scripts]
ds-msp-calibrate-rig = "ds_msp.rig.cli:main"
ds-msp-calibrate = "ds_msp.calib.cli:main"

# Package only the importable library; some top-level scripts (validate.py, visualize.py, …)
# are still ad-hoc CLI entry points that require a repo clone, not part of the package.
# Without this, setuptools flat-layout auto-discovery is ambiguous and the build fails
# ("Multiple top-level packages discovered").
[tool.setuptools.packages.find]
include = ["ds_msp*"]
# The multi-camera rig pipeline (ds_msp.rig) now ships in the wheel: its real-data
# validation gate is met (8-camera real rig + the MC-Calib Blender datasets — extrinsics
# within ~0.16% of ground truth at sub-pixel reprojection, matching MC-Calib's own RMS).

# calib_param.yml / calib_config.yml templates that `ds-msp-calibrate-rig`'s and
# `ds-msp-calibrate`'s `--init-config`/`--init-intrinsics` copy from (see ds_msp/rig/cli.py,
# ds_msp/calib/cli.py) -- setuptools does not include non-.py package data by default, so this
# must be declared explicitly or the wheel silently ships without them.
[tool.setuptools.package-data]
"ds_msp.rig" = ["configs/*.yml"]
"ds_msp.calib" = ["configs/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so cross-package test helpers (e.g. ``tests.rig._synth``)
# import identically under CI's non-editable install and a local editable checkout.
pythonpath = ["."]
markers = [
    "jac: analytic-Jacobian gradient-check tests (run on every model PR)",
    "contract: model-agnostic contract suite",
    "slow: long-running statistical tests (e.g. rig model-agnosticism)",
    "req: link a test to one or more requirement IDs (FR-…/NFR-…) for traceability",
    "realdata: validation against real datasets (dataset-gated; required pre-release)",
    "integration: end-to-end multi-component tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# web/ is the standalone TS visualiser (not part of the package); its lone Python
# helper is a dev-only reference dumper and is out of scope for package linting.
extend-exclude = ["web"]

[tool.mypy]
# Parse target is 3.12 so mypy can read typeshed/numpy's PEP 695 `type` stubs
# (mypy 2.1.0 ties `type`-statement parsing to python_version >= 3.12). Real
# 3.10 runtime compatibility stays enforced by the pytest matrix (3.10/3.11/3.12).
python_version = "3.12"
warn_unused_ignores = true
# Tighten per-module as the typed surface grows; core/ is fully typed.
[[tool.mypy.overrides]]
module = "ds_msp.core.*"
disallow_untyped_defs = true

# --- Decoupling rules (enforced in CI by import-linter; mirrored by the pure
# --- pytest AST gate in tests/contract/test_independence.py so they hold even
# --- without the tool installed). Layers listed high -> low; a lower layer may
# --- never import a higher one.
[tool.importlinter]
root_package = "ds_msp"

[[tool.importlinter.contracts]]
name = "core is the dependency-free foundation"
type = "forbidden"
source_modules = ["ds_msp.core"]
forbidden_modules = [
    "ds_msp.data", "ds_msp.geometry", "ds_msp.models", "ds_msp.detect",
    "ds_msp.ops", "ds_msp.adapt", "ds_msp.calib", "ds_msp.mvg",
    "ds_msp.stereo", "ds_msp.rig", "ds_msp.vo",
    "ds_msp.io", "ds_msp.cv", "ds_msp.ldc",
]

[[tool.importlinter.contracts]]
name = "data layer depends only on core"
type = "forbidden"
source_modules = ["ds_msp.data"]
forbidden_modules = [
    "ds_msp.geometry", "ds_msp.models", "ds_msp.detect", "ds_msp.ops",
    "ds_msp.adapt", "ds_msp.calib", "ds_msp.mvg", "ds_msp.stereo",
    "ds_msp.rig", "ds_msp.vo", "ds_msp.io", "ds_msp.cv", "ds_msp.ldc",
]

[[tool.importlinter.contracts]]
name = "geometry layer depends only on core and data"
type = "forbidden"
source_modules = ["ds_msp.geometry"]
forbidden_modules = [
    "ds_msp.models", "ds_msp.detect", "ds_msp.ops", "ds_msp.adapt",
    "ds_msp.calib", "ds_msp.mvg", "ds_msp.stereo", "ds_msp.rig",
    "ds_msp.vo", "ds_msp.io", "ds_msp.cv", "ds_msp.ldc",
]

[[tool.importlinter.contracts]]
name = "capability services are mutually independent"
type = "independence"
modules = ["ds_msp.ops", "ds_msp.adapt", "ds_msp.calib", "ds_msp.mvg", "ds_msp.stereo"]

[[tool.importlinter.contracts]]
name = "capabilities never import a pipeline (acyclic)"
type = "forbidden"
source_modules = ["ds_msp.ops", "ds_msp.adapt", "ds_msp.calib", "ds_msp.mvg", "ds_msp.stereo"]
forbidden_modules = ["ds_msp.rig", "ds_msp.vo"]

[[tool.importlinter.contracts]]
name = "pipelines compose capabilities but stay independent of each other"
type = "independence"
modules = ["ds_msp.rig", "ds_msp.vo"]
